<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий календарь и совпадение смен</title>
    <link rel="stylesheet" href="style/style.css">
    <!-- Иконки FontAwesome для интерфейса -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель: Управление профилями и сравнение -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-calendar-days"></i>
                <h2>График Смен</h2>
            </div>

            <!-- Секция добавления / редактирования профиля -->
            <div class="card">
                <h3><i class="fa-solid fa-user-pen"></i> Профиль</h3>
                <form id="profile-form">
                    <input type="hidden" id="edit-index" value="">
                    <div class="form-group">
                        <label for="username">Имя / Никнейм</label>
                        <input type="text" id="username" required placeholder="Например: Алексей">
                    </div>
                    <div class="form-group">
                        <label for="schedule-type">График работы</label>
                        <select id="schedule-type" required>
                            <option value="2-2-complex">2/2 (День, Ночь, Отсыпной, Выходной)</option>
                            <option value="1-3">1/3 (Сутки, Отсыпной, 2 Выходных)</option>
                            <option value="3-2-complex">3/2 (Утро/Вечер/Ночь сложный)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="start-date">Дата старта (1-й день графика)</label>
                        <input type="date" id="start-date" required>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary" id="save-btn"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
                        <button type="button" class="btn btn-secondary" id="cancel-edit" style="display:none;">Отмена</button>
                    </div>
                </form>
            </div>

            <!-- Список сохраненных пользователей -->
            <div class="card">
                <h3><i class="fa-solid fa-users"></i> Пользователи</h3>
                <div id="users-list" class="users-list">
                    <!-- Сюда динамически добавляются пользователи -->
                </div>
            </div>

            <!-- Совпадение выходных -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3><i class="fa-solid fa-handshake"></i> Совпадение выходных</h3>
                    <button type="button" class="btn btn-secondary" id="select-all-btn" style="padding: 4px 8px; font-size: 0.75rem;">Все / Снять</button>
                </div>
                <p class="hint">Выберите пользователей для отображения их смен в календаре и поиска совпадений:</p>
                <div id="compare-checkboxes" class="compare-list">
                    <!-- Чекбоксы пользователей -->
                </div>
                <div class="match-results" id="match-results">
                    Выберите хотя бы одного пользователя.
                </div>
            </div>

            <!-- Экспорт / Импорт -->
            <div class="card export-import-card">
                <h3><i class="fa-solid fa-file-export"></i> Данные</h3>
                <div class="btn-grid">
                    <button type="button" class="btn btn-outline" id="export-btn"><i class="fa-solid fa-download"></i> Экспорт</button>
                    <label for="import-file" class="btn btn-outline file-label"><i class="fa-solid fa-upload"></i> Импорт</label>
                    <input type="file" id="import-file" accept=".json" style="display: none;">
                </div>
            </div>
        </aside>

        <!-- Основная часть: Календарь -->
        <main class="main-content">
            <header class="calendar-header">
                <div class="month-navigation">
                    <button id="prev-month" class="btn-icon"><i class="fa-solid fa-chevron-left"></i></button>
                    <div class="date-selectors">
                        <select id="month-select" class="date-select" title="Выбрать месяц">
                            <option value="0">Январь</option>
                            <option value="1">Февраль</option>
                            <option value="2">Март</option>
                            <option value="3">Апрель</option>
                            <option value="4">Май</option>
                            <option value="5">Июнь</option>
                            <option value="6">Июль</option>
                            <option value="7">Август</option>
                            <option value="8">Сентябрь</option>
                            <option value="9">Октябрь</option>
                            <option value="10">Ноябрь</option>
                            <option value="11">Декабрь</option>
                        </select>
                        <select id="year-select" class="date-select" title="Выбрать год">
                            <!-- Годы генерируются через JS -->
                        </select>
                    </div>
                    <button id="next-month" class="btn-icon"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="header-actions">
                    <button id="today-btn" class="btn btn-outline">Сегодня</button>
                </div>
            </header>

            <!-- Легенда статусов -->
            <div class="legend">
                <span class="legend-item"><span class="dot work"></span> Рабочий (День / Утро)</span>
                <span class="legend-item"><span class="dot night"></span> Ночная смена</span>
                <span class="legend-item"><span class="dot rest"></span> Отсыпной</span>
                <span class="legend-item"><span class="dot weekend"></span> Выходной</span>
                <span class="legend-item"><span class="dot match-highlight"></span> Совпадение / Выходные</span>
            </div>

            <!-- Сетка календаря -->
            <div class="calendar-grid-wrapper">
                <div class="weekdays-row">
                    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
                </div>
                <div id="calendar-days" class="days-grid">
                    <!-- Дни месяца генерируются через JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
